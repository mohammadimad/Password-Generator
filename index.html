<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Random Password Generator</title>
    <!-- استدعاء خط Inter لتوفير مظهر عصري واحترافي -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div class="generator-card">
      <h1 class="title">
        Generate a <br /><span class="highlight">random password</span>
      </h1>
      <p class="subtitle">Never use an insecure password again.</p>

      <button onclick="Generateor()" class="generate-btn">
        Generate passwords
      </button>

      <hr class="divider" />

      <div class="passwords-container">
        <div id="pass1" class="password-box"></div>
        <div id="pass2" class="password-box"></div>
      </div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
